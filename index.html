<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema Typing</title>
    <!-- Tailwind CSS (デザイン用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons (アイコン用) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        /* --- カスタムスタイル --- */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap');

        body { font-family: 'Noto Sans JP', sans-serif; transition: background-color 0.3s; }
        .font-mono { font-family: 'Roboto Mono', monospace; }

        @keyframes progressBarStripes {
            from { background-position: 10px 0; }
            to { background-position: 0 0; }
        }
        .animate-stripes {
            background-size: 10px 10px;
            background-image: linear-gradient(45deg, rgba(255,255,255,.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.15) 50%, rgba(255,255,255,.15) 75%, transparent 75%, transparent);
            animation: progressBarStripes 1s linear infinite;
        }

        .shake-animation { animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        @keyframes urgentPulse {
            0%, 100% { box-shadow: inset 0 0 0 0 rgba(239, 68, 68, 0); }
            50% { box-shadow: inset 0 0 60px 20px rgba(239, 68, 68, 0.3); }
        }
        .urgent-mode { animation: urgentPulse 1s infinite; border: 4px solid #ef4444; }
        .urgent-text { color: #ef4444 !important; transform: scale(1.1); transition: all 0.2s; }

        /* 画面切り替え制御 (重要) */
        .screen { 
            display: none !important; /* 強制的に非表示 */
            opacity: 0; 
            transition: opacity 0.3s ease-in-out; 
        }
        .screen.active { 
            display: block !important; /* active時のみ表示 */
            opacity: 1; 
        }

        /* --- フィルムカウントダウン演出 --- */
        #screen-countdown {
            background-color: #1a1a1a;
            color: #e5e5e5;
            overflow: hidden;
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 9999;
        }
        /* カウントダウン画面が表示されるときは flex レイアウトにする */
        #screen-countdown.active {
            display: flex !important;
            align-items: center;
            justify-content: center;
        }
        
        /* フィルムの粒子ノイズ */
        .film-grain {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.15'/%3E%3C/svg%3E");
            opacity: 0.4;
            pointer-events: none;
            animation: grainFlicker 0.1s infinite;
        }
        @keyframes grainFlicker {
            0% { transform: translate(0,0); }
            25% { transform: translate(-2px, 2px); }
            50% { transform: translate(2px, -2px); }
            75% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, 2px); }
        }

        /* 古い映画のような縦傷 */
        .film-scratch {
            position: absolute;
            top: 0; left: 20%; width: 2px; height: 100%;
            background: rgba(255,255,255,0.2);
            animation: scratchMove 0.4s infinite linear;
            opacity: 0;
        }
        .film-scratch:nth-child(2) { left: 60%; animation-delay: 0.1s; width: 1px; }
        .film-scratch:nth-child(3) { left: 80%; animation-delay: 0.3s; width: 3px; }

        @keyframes scratchMove {
            0% { opacity: 0; transform: translateX(0); }
            10% { opacity: 0.6; }
            20% { opacity: 0; transform: translateX(10px); }
            100% { opacity: 0; }
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 40%, black 120%);
            pointer-events: none;
        }

        .countdown-circle {
            width: 300px; height: 300px;
            border: 8px solid #e5e5e5;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        
        .crosshair-h { position: absolute; width: 100%; height: 2px; background: rgba(255,255,255,0.5); top: 50%; left: 0; }
        .crosshair-v { position: absolute; width: 2px; height: 100%; background: rgba(255,255,255,0.5); top: 0; left: 50%; }

        .radar-sweep {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(255,255,255,0.4) 360deg);
            animation: radarSpin 1s linear infinite;
            opacity: 0.3;
        }
        @keyframes radarSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .countdown-number {
            font-family: 'Times New Roman', serif;
            font-size: 180px;
            font-weight: bold;
            line-height: 1;
            text-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-gray-800 selection:bg-blue-200 flex flex-col">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-20">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">

    </header>

    <!-- メインエリア -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 w-full max-w-5xl mx-auto relative">

        <!-- 1. メニュー画面 -->
        <div id="screen-menu" class="screen active w-full max-w-2xl text-center space-y-10 animate-in fade-in slide-in-from-bottom-4 duration-500">
            <div class="space-y-4">

                    <i data-lucide="film" class="w-16 h-16 text-blue-500"></i>
                </div>

                    MASTER THE <span class="text-blue-600">SCRIPT</span>
                </h2>
                <p class="text-xl text-slate-500 font-medium max-w-lg mx-auto">
                    名作映画やドラマの台詞をタイプして、賞金を稼ごう。<br/>コンボを繋げれば制限時間が延長されるぞ。
                </p>
                <div class="inline-flex items-center gap-2 px-6 py-2 bg-yellow-50 rounded-full border border-yellow-200 text-yellow-800 font-bold shadow-sm">

                    <span>自己ベスト: $<span id="highscore-display">0</span></span>

        <!-- 2. プレイ画面 -->

                    <div class="absolute right-0 top-0 h-full w-px bg-white/50"></div>
                </div>

                </div>

                        <div class="flex flex-col md:flex-row items-center justify-center gap-2 text-sm text-gray-400 font-bold uppercase tracking-widest">
                            <span id="character-name" class="text-gray-500">キャラ名</span>
                            <span class="hidden md:inline mx-2 text-gray-300">|</span>

                        </div>
                    </div>
                </div>
                <input type="text" id="hidden-input" class="absolute opacity-0 w-full h-full top-0 left-0 cursor-default" autocomplete="off">
            </div>

            <div class="flex justify-center">
                <button onclick="toggleTranslation()" id="translation-btn" class="flex items-center gap-2 px-6 py-2 rounded-full font-medium text-sm transition-all border bg-blue-50 text-blue-600 border-blue-200">
                    <i data-lucide="eye-off" class="w-4 h-4"></i><span>日本語訳を隠す</span>

            </div>
        </div>

        <!-- 3. 終了画面 -->
        <div id="screen-finished" class="screen w-full max-w-xl bg-white rounded-3xl p-10 shadow-2xl border border-gray-100 text-center animate-in zoom-in-95 duration-300">
            <div class="w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-6">

            </div>
            
            <h2 class="text-4xl font-black text-gray-800 mb-2" id="finish-title">給料日！</h2>

            <div class="mb-8 text-sm text-gray-500">

            <button onclick="shareOnX()" class="w-full mb-4 py-3 bg-black hover:bg-gray-800 text-white font-bold rounded-xl text-lg transition-all flex items-center justify-center gap-2">
                <svg viewBox="0 0 24 24" class="w-5 h-5 fill-current"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                結果をXでシェアする
            </button>

            <div class="flex flex-col gap-3">
                <button onclick="startPreGame()" class="w-full py-4 bg-gray-900 hover:bg-black text-white font-bold rounded-xl text-lg transition-all transform hover:scale-[1.02] flex items-center justify-center gap-2 shadow-lg">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i> もう一度プレイ
                </button>
                <button onclick="goHome()" class="w-full py-3 bg-white hover:bg-gray-50 text-gray-700 font-bold rounded-xl text-lg transition-all border border-gray-200 flex items-center justify-center gap-2">
                    <i data-lucide="home" class="w-5 h-5"></i> ホームに戻る
                </button>
            </div>
        </div>
    </main>

    <footer class="p-6 text-center text-gray-400 text-xs border-t border-gray-100 mt-auto">
        <p>&copy; 2024 Cinema Typing.</p>
    </footer>

    <!-- 4. カウントダウン画面 (修正: activeクラスがない限り display: none になるように修正) -->
    <div id="screen-countdown" class="screen">
        <div class="film-grain"></div>
        <div class="film-scratch"></div>
        <div class="film-scratch"></div>
        <div class="film-scratch"></div>
        <div class="vignette"></div>
        
        <div class="countdown-circle">
            <div class="crosshair-h"></div>
            <div class="crosshair-v"></div>
            <div class="radar-sweep"></div>
            <span id="countdown-number" class="countdown-number relative z-10">5</span>
        </div>
    </div>

    <!-- ゲームロジック -->
    <script>
        // --- 簡易サウンドマネージャー ---
        const Sound = {
            ctx: null,
            isMuted: false,
            init: function() {
                try {
                    if (!this.ctx) {
                        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                } catch (e) {
                    console.log("Audio not supported or blocked");
                }
            },
            playTone: function(freq, type, duration, vol = 0.1) {
                if (this.isMuted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) { }
            },
            type: function() { this.playTone(800, 'sine', 0.1, 0.1); },
            error: function() { this.playTone(150, 'sawtooth', 0.3, 0.2); },
            bonus: function() { 
                setTimeout(() => this.playTone(1000, 'square', 0.1, 0.1), 0);
                setTimeout(() => this.playTone(1500, 'square', 0.1, 0.1), 100);
                setTimeout(() => this.playTone(2000, 'square', 0.2, 0.1), 200);
            },
            count: function() { this.playTone(1000, 'sine', 0.1, 0.2); },
            countStart: function() { this.playTone(2000, 'square', 0.3, 0.2); },
            finish: function() {
                this.playTone(400, 'triangle', 0.5, 0.2);
                setTimeout(() => this.playTone(600, 'triangle', 0.5, 0.2), 200);
                setTimeout(() => this.playTone(800, 'triangle', 1.0, 0.2), 400);
            }
        };

            { text: "Keep your friends close, but your enemies closer.", translation: "友は近くに置け。敵はもっと近くに置け。", source: "The Godfather Part II", character: "Michael Corleone", level: 2 },
            { text: "With great power comes great responsibility.", translation: "大いなる力には、大いなる責任が伴う。", source: "Spider-Man", character: "Uncle Ben", level: 2 },
            { text: "Houston, we have a problem.", translation: "ヒューストン、トラブル発生だ。", source: "Apollo 13", character: "Jim Lovell", level: 2 },
            { text: "There's no place like home.", translation: "やっぱりお家が一番。", source: "The Wizard of Oz", character: "Dorothy Gale", level: 2 },
            { text: "Mornings are for coffee and contemplation.", translation: "朝はコーヒーと思索のためにある。", source: "Stranger Things", character: "Jim Hopper", level: 2 },
            { text: "I'm the king of the world!", translation: "世界は俺のものだ！", source: "Titanic", character: "Jack Dawson", level: 2 },
            { text: "Carpe diem. Seize the day, boys.", translation: "カーペ・ディエム。今を生きろ、若者たちよ。", source: "Dead Poets Society", character: "John Keating", level: 2 },
            { text: "Elementary, my dear Watson.", translation: "初歩的なことだよ、ワトソン君。", source: "Sherlock Holmes", character: "Sherlock Holmes", level: 2 },
            { text: "I volunteer! I volunteer as tribute!", translation: "私が志願します！ 私が生け贄になります！", source: "The Hunger Games", character: "Katniss Everdeen", level: 2 },
            { text: "On Wednesdays we wear pink.", translation: "水曜日はピンクを着るの。", source: "Mean Girls", character: "Karen Smith", level: 2 },
            { text: "Nobody puts Baby in a corner.", translation: "ベイビーを隅っこになんか置かせない。", source: "Dirty Dancing", character: "Johnny Castle", level: 2 },
            { text: "It's an entire world of just 64 squares.", translation: "たった64マスの盤上に、完全な世界があるの。", source: "The Queen's Gambit", character: "Beth Harmon", level: 2 },
            { text: "That's my secret, Captain. I'm always angry.", translation: "それが秘密です、キャプテン。私は常に怒っている。", source: "The Avengers", character: "Bruce Banner", level: 2 },
            { text: "Dormammu, I've come to bargain.", translation: "ドルマムゥ、取引に来た。", source: "Doctor Strange", character: "Doctor Strange", level: 2 },
            { text: "I can do this all day.", translation: "まだやれるぞ（一日中だってできる）。", source: "Captain America: The First Avenger", character: "Captain America", level: 2 },
            { text: "He's a friend from work!", translation: "仕事の友達なんだ！", source: "Thor: Ragnarok", character: "Thor", level: 2 },
            { text: "Genius, billionaire, playboy, philanthropist.", translation: "天才、金持ち、遊び人、慈善家。", source: "The Avengers", character: "Tony Stark", level: 2 },
            { text: "Nothing goes over my head. I would catch it.", translation: "何も頭上を通過したりしない。私が捕まえる。", source: "Guardians of the Galaxy", character: "Drax", level: 2 },
            { text: "Life is like a box of chocolates. You never know what you're gonna get.", translation: "人生はチョコレートの箱みたいなもの。開けてみるまで中身はわからない。", source: "Forrest Gump", character: "Forrest Gump", level: 3 },
            { text: "The first rule of Fight Club is: You do not talk about Fight Club.", translation: "ファイト・クラブのルールその1、ファイト・クラブのことを口外するな。", source: "Fight Club", character: "Tyler Durden", level: 3 },
            { text: "You can't handle the truth!", translation: "お前たちに真実は扱えない！", source: "A Few Good Men", character: "Col. Jessup", level: 3 },
            { text: "Just keep swimming. Just keep swimming. Just keep swimming, swimming, swimming.", translation: "泳ぎ続けましょ。泳ぎ続けて。泳いで、泳いで、泳ぐのよ。", source: "Finding Nemo", character: "Dory", level: 3 },
            { text: "Don't let the noise of others' opinions drown out your own inner voice.", translation: "他人の意見という雑音に、自分の内なる声をかき消させてはいけない。", source: "Steve Jobs (Bio)", character: "Steve Jobs", level: 3 },
            { text: "It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.", translation: "十分な資産を持つ独身男性は妻を求めているに違いないというのは、普遍的な真理である。", source: "Pride & Prejudice", character: "Jane Austen (Narrator)", level: 3 },
            { text: "Never forget what you are. The rest of the world will not. Wear it like armor, and it can never be used to hurt you.", translation: "自分が何者か決して忘れるな。世界は忘れてくれない。それを鎧のようにまとえば、決して傷つくことはない。", source: "Game of Thrones", character: "Tyrion Lannister", level: 3 },
            { text: "I'm not a psychopath, I'm a high-functioning sociopath. Do your research.", translation: "僕はサイコパスじゃない、高機能社会不適合者だ。よく調べろ。", source: "Sherlock", character: "Sherlock Holmes", level: 3 },
            { text: "It does not do to dwell on dreams and forget to live.", translation: "夢に耽って生きることを忘れてはいけない。", source: "Harry Potter", character: "Albus Dumbledore", level: 3 },
            { text: "Here's to the ones who dream, foolish as they may seem.", translation: "夢を追いかける人々に乾杯。たとえ愚かに見えても。", source: "La La Land", character: "Mia Dolan", level: 3 },
            { text: "I act as if I don't care if people dislike me. Deep down... I secretly enjoy it.", translation: "人に嫌われても平気なふりをしてるけど、心の奥底では…実はそれを楽しんでるの。", source: "Wednesday", character: "Wednesday Addams", level: 3 },
            { text: "The hardest choices require the strongest wills.", translation: "最も困難な選択には、最強の意志が必要なのだ。", source: "Avengers: Infinity War", character: "Thanos", level: 3 },
            { text: "Part of the journey is the end.", translation: "旅の一部は、終わりを迎えることだ。", source: "Avengers: Endgame", character: "Tony Stark", level: 3 },
            { text: "I told you. I don't want to join your super-secret boy band.", translation: "言ったろ。君の超極秘アイドルグループに参加する気はないって。", source: "The Avengers", character: "Tony Stark", level: 3 },
        ];

        // --- 変数と定数 ---
        const BASE_TIME = 60;
        const BONUS_TIME_THRESHOLD = 30;
        const BONUS_TIME_AMOUNT = 5;

        let gameState = 'menu';
        let currentQuote = null;
        let availableQuotes = [];
        let userInput = '';
        let timeLeft = BASE_TIME;
        let score = 0;
        let streak = 0;
        let streakProgress = 0;
        let maxStreak = 0;
        let highScore = 0;
        let timerId = null;
        let showTranslation = true;
        let selectedLevel = 'all';

        // --- DOM ---
        const dom = {
            screens: { menu: document.getElementById('screen-menu'), countdown: document.getElementById('screen-countdown'), playing: document.getElementById('screen-playing'), finished: document.getElementById('screen-finished') },
            countdownNumber: document.getElementById('countdown-number'),
            timeDisplay: document.getElementById('time-display'),
            timerContainer: document.getElementById('timer-container'),
            clockIcon: document.getElementById('clock-icon'),
            scoreDisplay: document.getElementById('score-display'),
            highscoreDisplay: document.getElementById('highscore-display'),
            finishTitle: document.getElementById('finish-title'),
            finishMessage: document.getElementById('finish-message'),
            resultScore: document.getElementById('result-score'),
            resultMaxStreak: document.getElementById('result-max-streak'),
            resultHighscore: document.getElementById('result-highscore'),
            newRecordBadge: document.getElementById('new-record-badge'),
            typingText: document.getElementById('typing-text-area'),
            hiddenInput: document.getElementById('hidden-input'),
            typingCard: document.getElementById('typing-card'),
            streakDisplay: document.getElementById('streak-display'),
            streakBar: document.getElementById('streak-bar'),
            charsLeftDisplay: document.getElementById('chars-left-display'),
            bonusPopup: document.getElementById('bonus-popup'),
            translationArea: document.getElementById('translation-area'),
            translationText: document.getElementById('translation-text'),
            characterName: document.getElementById('character-name'),
            sourceName: document.getElementById('source-name'),
            translationBtn: document.getElementById('translation-btn'),
            rewardBadge: document.getElementById('reward-badge'),
            levelSelector: document.getElementById('level-selector'),
            muteBtn: document.getElementById('mute-btn')
        };

        // --- 初期化 ---
        window.onload = () => {
            loadHighscore();
            renderLevelSelector();
            try { lucide.createIcons(); } catch(e) {}
            
            dom.hiddenInput.addEventListener('input', handleInput);
            document.addEventListener('click', () => { if (gameState === 'playing') focusInput(); });
            
            // 安全策: アイコン読み込みが遅延しても画面を表示
            setTimeout(() => { document.body.style.opacity = '1'; }, 100);
        };

        function loadHighscore() {
            const saved = localStorage.getItem('cinemaTypingHighScore');
            if (saved) {
                highScore = parseInt(saved, 10);
                dom.highscoreDisplay.textContent = highScore.toLocaleString();
            }
        }

        // --- 音量切り替え ---
        function toggleMute() {
            Sound.isMuted = !Sound.isMuted;
            const icon = Sound.isMuted ? 'volume-x' : 'volume-2';
            dom.muteBtn.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i>`;
            try { lucide.createIcons(); } catch(e) {}
        }

        // --- 難易度 ---
        function renderLevelSelector() {
            const levels = [
                { id: 'all', label: 'すべて', desc: 'MIXED', color: 'bg-gray-100 text-gray-700 border-gray-200' },
                { id: 1, label: '短文', desc: '$100', color: 'bg-green-50 text-green-700 border-green-200' },
                { id: 2, label: '中文', desc: '$300 (+10s)', color: 'bg-blue-50 text-blue-700 border-blue-200' },
                { id: 3, label: '長文', desc: '$1,000 (+20s)', color: 'bg-purple-50 text-purple-700 border-purple-200' },
            ];
            dom.levelSelector.innerHTML = levels.map(l => `
                <button onclick="selectLevel('${l.id}')" 
                    class="relative p-4 rounded-xl border-2 transition-all duration-200 flex flex-col items-center justify-center gap-1
                    ${selectedLevel === l.id 
                        ? `${l.color.replace('bg-', 'bg-opacity-100 ')} border-current ring-2 ring-offset-2 ring-blue-200 transform scale-105 shadow-md`
                        : 'bg-white border-gray-100 text-gray-400 hover:bg-gray-50 hover:border-gray-200'
                    }">
                    <span class="font-bold text-lg">${l.label}</span>
                    <span class="text-xs font-mono opacity-80 whitespace-nowrap">${l.desc}</span>
                    ${selectedLevel === l.id ? '<div class="absolute top-2 right-2 w-2 h-2 rounded-full bg-current"></div>' : ''}
                </button>
            `).join('');
        }

        function selectLevel(id) {
            selectedLevel = id === 'all' ? 'all' : parseInt(id);
            renderLevelSelector();
        }

        // --- ゲーム進行 ---
        function switchScreen(screenName) {
            Object.values(dom.screens).forEach(el => el.classList.remove('active'));
            dom.screens[screenName].classList.add('active');
            window.scrollTo(0, 0); // スクロールリセット
            try { lucide.createIcons(); } catch(e) {}
        }

        // STEP 1: ボタンを押すとカウントダウン開始
        function startPreGame() {
            Sound.init();
            gameState = 'countdown';
            switchScreen('countdown');
            window.scrollTo(0, 0);
            startCountdown();
        }

        // STEP 2: カウントダウン処理
        function startCountdown() {
            let count = 5;
            dom.countdownNumber.textContent = count;
            Sound.count();

            const interval = setInterval(() => {
                count--;
                if (count > 0) {
                    dom.countdownNumber.textContent = count;
                    Sound.count();
                } else {
                    clearInterval(interval);
                    Sound.countStart();
                    startGame();
                }
            }, 1000);
        }

        // STEP 3: 実際のゲーム開始
        function startGame() {
            gameState = 'playing';
            score = 0; streak = 0; streakProgress = 0; maxStreak = 0;
            
            let initialTime = BASE_TIME;
            if (selectedLevel === 2) initialTime += 10;
            if (selectedLevel === 3) initialTime += 20;
            timeLeft = initialTime;
            
            userInput = '';
            
            let candidates = QUOTES_DATA;
            if (selectedLevel !== 'all') { candidates = QUOTES_DATA.filter(q => q.level === selectedLevel); }
            availableQuotes = [...candidates].sort(() => Math.random() - 0.5);
            
            document.body.classList.remove('urgent-mode');
            dom.timeDisplay.classList.remove('urgent-text');
            dom.timerContainer.classList.remove('border-red-500', 'bg-red-50');
            
            updateDisplay();
            switchScreen('playing');
            nextQuote();
            startTimer();
            focusInput();
        }

        function goHome() {
            gameState = 'menu';
            document.body.classList.remove('urgent-mode');
            switchScreen('menu');
        }

        function startTimer() {
            if (timerId) clearInterval(timerId);
            timerId = setInterval(() => {
                timeLeft--;
                if (timeLeft <= 0) { timeLeft = 0; endGame(false); }
                updateTimeDisplay();
            }, 1000);
        }

        function endGame(isComplete) {
            clearInterval(timerId);
            gameState = 'finished';
            document.body.classList.remove('urgent-mode');
            Sound.finish();

            if (isComplete) {
                dom.finishTitle.textContent = "全問クリア！";
                dom.finishTitle.classList.add("text-blue-600");
                dom.finishMessage.textContent = "素晴らしい！すべてのセリフをタイプしました！";
            } else {
                dom.finishTitle.textContent = "給料日！";
                dom.finishTitle.classList.remove("text-blue-600");
                dom.finishMessage.textContent = "お疲れ様でした。今回の成績です。";
            }
            
            let isNewRecord = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('cinemaTypingHighScore', score.toString());
                isNewRecord = true;
                dom.highscoreDisplay.textContent = highScore.toLocaleString();
            }

            dom.resultScore.textContent = `$${score.toLocaleString()}`;
            dom.resultMaxStreak.textContent = maxStreak;
            dom.resultHighscore.textContent = highScore.toLocaleString();
            
            dom.newRecordBadge.classList.toggle('hidden', !(isNewRecord && score > 0));
            switchScreen('finished');
        }

        function nextQuote() {
            if (availableQuotes.length === 0) { endGame(true); return; }
            currentQuote = availableQuotes.pop();
            userInput = '';
            dom.hiddenInput.value = '';
            updateQuoteDisplay();
            renderText();
        }

        // --- 入力 ---
        function focusInput() { dom.hiddenInput.focus(); }

        function handleInput(e) {
            if (gameState !== 'playing') return;
            const val = e.target.value;
            const targetText = currentQuote.text;

            if (val.length > targetText.length) { dom.hiddenInput.value = userInput; return; }
            if (val.length < userInput.length) {
                userInput = val; streak = 0; streakProgress = 0;
                updateStreakDisplay(); renderText(); return;
            }

            const lastCharIndex = val.length - 1;
            const isCorrect = val[lastCharIndex] === targetText[lastCharIndex];

            if (isCorrect) {
                userInput = val;
                streak++;
                if (streak > maxStreak) maxStreak = streak;
                Sound.type();
                
                streakProgress++;
                if (streakProgress >= BONUS_TIME_THRESHOLD) {
                    timeLeft += BONUS_TIME_AMOUNT;
                    streakProgress = 0;
                    triggerBonusAnimation();
                    updateTimeDisplay();
                    Sound.bonus();
                }
                
                setFeedback('correct');
                if (userInput === targetText) {
                    addScore();
                    setTimeout(nextQuote, 100);
                }
            } else {
                dom.hiddenInput.value = userInput;
                streak = 0; streakProgress = 0;
                setFeedback('wrong');
                Sound.error();
            }
            updateStreakDisplay();
            renderText();
        }

        function addScore() {
            let money = 0;
            if (currentQuote.level === 1) money = 100;
            else if (currentQuote.level === 2) money = 300;
            else money = 1000;
            score += money;
            updateDisplay();
        }

        // --- 表示更新 ---
        function updateDisplay() {
            dom.scoreDisplay.textContent = score.toLocaleString();
            updateTimeDisplay();
            updateStreakDisplay();
        }

        function updateTimeDisplay() {
            dom.timeDisplay.textContent = timeLeft;
            if (timeLeft <= 5 && timeLeft > 0) {
                document.body.classList.add('urgent-mode');
                dom.timeDisplay.classList.add('urgent-text');
                dom.timerContainer.classList.add('border-red-500', 'bg-red-50');
                dom.clockIcon.classList.add('text-red-500', 'animate-pulse');
            } else if (timeLeft > 5) {
                document.body.classList.remove('urgent-mode');
                dom.timeDisplay.classList.remove('urgent-text');
                dom.timerContainer.classList.remove('border-red-500', 'bg-red-50');
                if (timeLeft < 10) {
                    dom.timeDisplay.parentElement.classList.add('text-red-500');
                    dom.clockIcon.classList.add('text-red-500');
                } else {
                    dom.timeDisplay.parentElement.classList.remove('text-red-500');
                    dom.clockIcon.classList.remove('text-red-500', 'animate-pulse');
                    dom.clockIcon.classList.add('text-slate-500');
                }
            }
        }

        function updateStreakDisplay() {
            dom.streakDisplay.textContent = streak;
            const progressPercent = (streakProgress / BONUS_TIME_THRESHOLD) * 100;
            dom.streakBar.style.width = `${progressPercent}%`;
            dom.charsLeftDisplay.textContent = Math.max(0, BONUS_TIME_THRESHOLD - streakProgress);
        }

        function updateQuoteDisplay() {
            let colorClass = ""; let amount = "";
            if (currentQuote.level === 1) { colorClass = "bg-green-50 text-green-600 border-green-200"; amount = "$100"; }
            else if (currentQuote.level === 2) { colorClass = "bg-blue-50 text-blue-600 border-blue-200"; amount = "$300"; }
            else { colorClass = "bg-purple-50 text-purple-600 border-purple-200"; amount = "$1,000"; }
            
            dom.rewardBadge.className = `px-3 py-1 rounded-full text-sm font-bold border ${colorClass}`;
            dom.rewardBadge.textContent = `+ ${amount}`;
            dom.translationText.textContent = `"${currentQuote.translation}"`;
            dom.characterName.textContent = currentQuote.character;
            dom.sourceName.textContent = currentQuote.source;
        }

        function renderText() {
            const chars = currentQuote.text.split('');
            const html = chars.map((char, index) => {
                let classes = "transition-colors duration-100 ";
                if (index < userInput.length) {
                    if (userInput[index] === char) { classes += "text-blue-600 font-bold"; } 
                    else { classes += "text-red-500 bg-red-100"; }
                } else if (index === userInput.length) {
                    classes += "bg-blue-100 border-b-2 border-blue-500 text-gray-800 animate-pulse";
                } else { classes += "text-gray-400"; }
                return `<span class="${classes}">${char}</span>`;
            }).join('');
            dom.typingText.innerHTML = html;
        }

        // --- UI ---
        function setFeedback(type) {
            dom.typingCard.classList.remove('border-white', 'border-red-400', 'border-blue-100', 'shake-animation');
            if (type === 'wrong') {
                dom.typingCard.classList.add('border-red-400', 'shake-animation');
                setTimeout(() => dom.typingCard.classList.remove('shake-animation'), 300);
            } else if (type === 'correct') { dom.typingCard.classList.add('border-blue-100'); } 
            else { dom.typingCard.classList.add('border-white'); }
        }

        function triggerBonusAnimation() {
            dom.bonusPopup.classList.remove('opacity-0', 'pointer-events-none');
            dom.bonusPopup.classList.add('animate-bounce');
            setTimeout(() => {
                dom.bonusPopup.classList.add('opacity-0', 'pointer-events-none');
                dom.bonusPopup.classList.remove('animate-bounce');
            }, 1000);
        }

        function toggleTranslation() {
            showTranslation = !showTranslation;
            if (showTranslation) {
                dom.translationArea.classList.remove('max-h-0', 'opacity-0', 'mt-0');
                dom.translationArea.classList.add('max-h-32', 'opacity-100', 'mt-6');
                dom.translationBtn.innerHTML = `<i data-lucide="eye-off" class="w-4 h-4"></i><span>日本語訳を隠す</span>`;
                dom.translationBtn.classList.replace('bg-white', 'bg-blue-50');
                dom.translationBtn.classList.replace('text-gray-400', 'text-blue-600');
            } else {
                dom.translationArea.classList.remove('max-h-32', 'opacity-100', 'mt-6');
                dom.translationArea.classList.add('max-h-0', 'opacity-0', 'mt-0');
                dom.translationBtn.innerHTML = `<i data-lucide="eye" class="w-4 h-4"></i><span>日本語訳を表示</span>`;
                dom.translationBtn.classList.replace('bg-blue-50', 'bg-white');
                dom.translationBtn.classList.replace('text-blue-600', 'text-gray-400');
            }
            try { lucide.createIcons(); } catch(e) {}
        }

        function shareOnX() {
            const text = `Cinema Typingで$${score.toLocaleString()}を稼ぎました！\n最大コンボ: ${maxStreak}\n\n映画の名台詞でタイピング練習！`;
            const url = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(text);
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
